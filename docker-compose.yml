version: '3.8'

services:
  # API Gateway
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILE: dev
      LOG_LEVEL: INFO
      GATEWAY_LOG_LEVEL: DEBUG
      
      # Service URLs
      USER_SERVICE_URL: http://user-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8083
      CLASS_SERVICE_URL: http://class-service:8084
      ADMIN_SERVICE_URL: http://admin-service:8086
      PAYMENT_SERVICE_URL: http://payment-service:8085
      TEACHER_REQUEST_SERVICE_URL: http://user-service:8081
      
      # CORS
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      
      # JVM Settings
      JAVA_OPTS: "-Xmx512m -Xms256m"
    networks:
      - skillnest-network
    depends_on:
      - user-service
      - course-service
      - enrollment-service
      - class-service
      - admin-service
      - payment-service
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # User Service
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILE: dev
      SERVER_PORT: 8081
      LOG_LEVEL: INFO
      FIREBASE_CONFIG_PATH: /app/firebase.json
    volumes:
      - ./firebase.json:/app/firebase.json:ro
    networks:
      - skillnest-network
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Course Service
  course-service:
    build:
      context: ./backend/course-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILE: dev
      SERVER_PORT: 8082
      LOG_LEVEL: INFO
      FIREBASE_CONFIG_PATH: /app/firebase.json
    volumes:
      - ./firebase.json:/app/firebase.json:ro
    networks:
      - skillnest-network
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Enrollment Service
  enrollment-service:
    build:
      context: ./backend/enrollment-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILE: dev
      SERVER_PORT: 8083
      LOG_LEVEL: INFO
      FIREBASE_CONFIG_PATH: /app/firebase.json
    volumes:
      - ./firebase.json:/app/firebase.json:ro
    networks:
      - skillnest-network
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Class Service
  class-service:
    build:
      context: ./backend/class-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILE: dev
      SERVER_PORT: 8084
      LOG_LEVEL: INFO
      FIREBASE_CONFIG_PATH: /app/firebase.json
    volumes:
      - ./firebase.json:/app/firebase.json:ro
    networks:
      - skillnest-network
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Payment Service
  payment-service:
    build:
      context: ./backend/payment-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILE: dev
      SERVER_PORT: 8085
      LOG_LEVEL: INFO
      FIREBASE_CONFIG_PATH: /app/firebase.json
      STRIPE_API_KEY: ${STRIPE_API_KEY:sk_test_placeholder}
    volumes:
      - ./firebase.json:/app/firebase.json:ro
    networks:
      - skillnest-network
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Admin Service
  admin-service:
    build:
      context: ./backend/admin-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILE: dev
      SERVER_PORT: 8086
      LOG_LEVEL: INFO
      FIREBASE_CONFIG_PATH: /app/firebase.json
    volumes:
      - ./firebase.json:/app/firebase.json:ro
    networks:
      - skillnest-network
    healthcheck:
      test: ["CMD", "wget", "-O-", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  skillnest-network:
    driver: bridge

volumes:
  logs:
