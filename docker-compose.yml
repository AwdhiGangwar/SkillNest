services:
  api-gateway:
    build: ./backend/api-gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: "http://user-service:8081"
      COURSE_SERVICE_URL: "http://course-service:8082"
      ENROLLMENT_SERVICE_URL: "http://enrollment-service:8083"
      CLASS_SERVICE_URL: "http://class-service:8084"
      ADMIN_SERVICE_URL: "http://admin-service:8086"
      TEACHER_REQUEST_SERVICE_URL: "http://user-service:8081"

  user-service:
    build: ./backend/user-service
    ports:
      - "8081:8081"

  course-service:
    build: ./backend/course-service
    ports:
      - "8082:8082"

  enrollment-service:
    build: ./backend/enrollment-service
    ports:
      - "8083:8083"

  class-service:
    build: ./backend/class-service
    ports:
      - "8084:8084"

  admin-service:
    build: ./backend/admin-service
    ports:
      - "8086:8086"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway