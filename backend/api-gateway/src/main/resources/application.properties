# ===============================
# SERVER CONFIG
# ===============================
server.port=8080
spring.application.name=API-GATEWAY

# ===============================
# USER SERVICE
# ===============================
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**,/api/me

# ===============================
# COURSE SERVICE
# ===============================
spring.cloud.gateway.routes[1].id=course-service
spring.cloud.gateway.routes[1].uri=${COURSE_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/courses/**,/api/modules/**,/api/lessons/**,/api/progress/**,/api/quizzes/**,/api/assignments/**,/api/submissions/**

# ===============================
# ENROLLMENT SERVICE
# ===============================
spring.cloud.gateway.routes[2].id=enrollment-service
spring.cloud.gateway.routes[2].uri=${ENROLLMENT_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/enrollments/**,/api/my-courses,/api/enrollment-requests/**

# ===============================
# CLASS SERVICE
# ===============================
spring.cloud.gateway.routes[3].id=class-service
spring.cloud.gateway.routes[3].uri=${CLASS_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/classes/**,/api/availability/**,/api/earnings/**

# ===============================
# TEACHER REQUEST SERVICE
# ===============================
spring.cloud.gateway.routes[4].id=teacher-request-service
spring.cloud.gateway.routes[4].uri=${TEACHER_REQUEST_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/teacher-requests/**

# ===============================
# ADMIN SERVICE
# ===============================
spring.cloud.gateway.routes[5].id=admin-service
spring.cloud.gateway.routes[5].uri=${ADMIN_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/admin/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/api/admin/(?<segment>.*), /admin/${segment}

# ===============================
# GLOBAL CORS CONFIG
# ===============================
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# ===============================
# DEFAULT FILTERS
# ===============================
spring.cloud.gateway.default-filters[0]=RemoveRequestHeader=Cookie

# ===============================
# TIMEOUT CONFIG
# ===============================
spring.cloud.gateway.httpclient.connect-timeout=${GATEWAY_CONNECT_TIMEOUT:15000}
spring.cloud.gateway.httpclient.response-timeout=${GATEWAY_RESPONSE_TIMEOUT:60s}

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty.http.client=INFO